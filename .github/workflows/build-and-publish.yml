name: Build and Publish to Google Artifact Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: "entrypoint-webapp"
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_HOSTNAME: ${{ vars.GAR_HOSTNAME }}
  GAR_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GAR_WORKLOAD_IDENTITY_PROVIDER }}
  GAR_SERVICE_ACCOUNT: ${{ vars.GAR_SERVICE_ACCOUNT }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: "write"
      id-token: "write"

    outputs:
      version: ${{ steps.changeset.outputs.version }}
      image_version_tag: "${{ env.GAR_LOCATION }}/${{ env.IMAGE_NAME }}:${{ steps.changeset.outputs.version }}"
      image_sha_tag: "${{ env.GAR_LOCATION }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
      image_path: "${{ env.GAR_LOCATION }}/${{ env.IMAGE_NAME }}:${{ steps.changeset.outputs.version }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run changeset version
        id: changeset
        run: |
          npx changeset version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag
        id: commit_version
        env:
          VERSION: ${{ steps.changeset.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "No version changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .changeset
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      # Authenticate to Google Cloud using Workload Identity Federation.
      # This is the recommended and most secure way to authenticate from GitHub Actions.
      #
      # You will need to set up Workload Identity Federation in your GCP project and create
      # a service account with the 'Artifact Registry Writer' role.
      #
      # Then, you must create two secrets in your GitHub repository settings:
      #   - `GAR_WORKLOAD_IDENTITY_PROVIDER`: The full name of your WIF provider.
      #   - `GAR_SERVICE_ACCOUNT`: The email address of your GCP service account.
      #
      - name: Authenticate to Google Cloud
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ env.GAR_WORKLOAD_IDENTITY_PROVIDER }} # e.g., projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: ${{ env.GAR_SERVICE_ACCOUNT }} # e.g., my-service-account@my-project.iam.gserviceaccount.com

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_HOSTNAME }}

      # Set up Docker Buildx for more advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This step builds the Docker image and pushes it to Google Artifact Registry.
      # Images are tagged with the workflow SHA and the calculated semantic version.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}/${{ env.IMAGE_NAME }}:${{ steps.changeset.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-cloud-run:
    name: Deploy to Cloud Run
    needs: build-and-push
    permissions:
      contents: "read"
      id-token: "write"
      deployments: "write"
      pull-requests: "read"
      actions: "read"
    uses: ./.github/workflows/deploy-to-cloud-run.yml
    with:
      image: ${{ needs.build-and-push.outputs.image_path }}
      environment: Dev
    secrets: inherit
