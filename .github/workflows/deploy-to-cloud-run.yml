name: Deploy to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'The full Docker image path to deploy (e.g., us-central1-docker.pkg.dev/project/repo/image:tag)'
        required: true
      environment:
        description: 'GitHub environment to target (for vars and secrets)'
        required: false
        default: 'Dev'
  workflow_call:
    inputs:
      image:
        description: 'The full Docker image path to deploy'
        required: true
        type: string
      environment:
        description: 'GitHub environment to target (for vars and secrets)'
        required: false
        type: string
        default: 'Dev'

env:
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ inputs.image || github.event.inputs.image }}

  release-notes:
    name: Generate release notes
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    uses: ./.github/workflows/deployment-release-notes.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    with:
      environment: ${{ inputs.environment || github.event.inputs.environment || 'Dev' }}
      head_sha: ${{ github.sha }}
      run_id: ${{ github.run_id }}
      deployer: ${{ github.actor }}
      image: ${{ inputs.image || github.event.inputs.image }}
    secrets:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
