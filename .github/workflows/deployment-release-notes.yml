name: Deployment Release Notes

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment name (e.g., Dev, Production)"
        required: true
        type: string
      head_sha:
        description: "Commit SHA that was deployed"
        required: true
        type: string
      run_id:
        description: "GitHub Actions run ID that performed the deployment"
        required: true
        type: string
      deployment_id:
        description: "GitHub deployment ID (optional; workflow will auto-discover if omitted)"
        required: false
        type: string
      image:
        description: "Deployed image reference (optional)"
        required: false
        type: string
      deployer:
        description: "GitHub username that initiated the deployment"
        required: false
        type: string
    secrets:
      JIRA_BASE_URL:
        required: false
      JIRA_EMAIL:
        required: false
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  build-release-notes:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.generate_notes.outputs.base_sha }}
      head_sha: ${{ steps.generate_notes.outputs.head_sha }}
      environment: ${{ steps.generate_notes.outputs.environment }}
      deployment_id: ${{ steps.generate_notes.outputs.deployment_id }}
      run_url: ${{ steps.generate_notes.outputs.run_url }}
      status_summary: ${{ steps.generate_notes.outputs.status_summary }}
      deployed_by: ${{ steps.generate_notes.outputs.deployed_by }}
      highlights_json: ${{ steps.generate_notes.outputs.highlights_json }}
    steps:
      - name: Generate release notes
        id: generate_notes
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_HEAD_SHA: ${{ inputs.head_sha }}
          DEPLOY_RUN_ID: ${{ inputs.run_id }}
          DEPLOYMENT_ID_INPUT: ${{ inputs.deployment_id }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          DEPLOY_INITIATOR: ${{ inputs.deployer }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const environment = (process.env.DEPLOY_ENVIRONMENT || '').trim();
            const headSha = (process.env.DEPLOY_HEAD_SHA || '').trim();
            const runId = (process.env.DEPLOY_RUN_ID || '').trim();
            const explicitDeploymentId = (process.env.DEPLOYMENT_ID_INPUT || '').trim();
            const deployerInput = (process.env.DEPLOY_INITIATOR || '').trim();
            const image = (process.env.DEPLOY_IMAGE || '').trim();

            if (!environment) {
              core.setFailed('Environment input is required.');
              return;
            }
            core.info(`Release notes for environment: ${environment}`);

            if (!headSha) {
              core.setFailed('head_sha input is required.');
              return;
            }

            if (!runId) {
              core.setFailed('run_id input is required.');
              return;
            }

            const permittedEnvs = ['Dev', 'Production'];
            if (!permittedEnvs.includes(environment)) {
              core.notice(`Environment ${environment} is not configured for release notes.`);
              core.setOutput('release_notes', '');
              core.setOutput('base_sha', '');
              core.setOutput('head_sha', headSha);
              core.setOutput('environment', '');
              core.setOutput('deployment_id', '');
              core.setOutput('run_url', '');
              core.setOutput('status_summary', '');
              return;
            }

            const deployer = deployerInput || context.actor || github.actor || 'unknown';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            async function fetchDeploymentById(id) {
              try {
                const { data } = await github.rest.repos.getDeployment({
                  owner,
                  repo,
                  deployment_id: Number(id),
                });
                return data;
              } catch (error) {
                core.warning(`Unable to load deployment ${id}: ${error.message}`);
                return null;
              }
            }

            async function findCurrentDeployment() {
              if (explicitDeploymentId) {
                const deployment = await fetchDeploymentById(explicitDeploymentId);
                if (deployment) {
                  return deployment;
                }
              }

              try {
                const deploymentsForSha = await github.paginate(github.rest.repos.listDeployments, {
                  owner,
                  repo,
                  sha: headSha,
                  environment,
                  per_page: 50,
                });
                if (deploymentsForSha.length) {
                  return deploymentsForSha[0];
                }
              } catch (error) {
                core.warning(`Unable to list deployments for ${environment} / ${headSha}: ${error.message}`);
              }

              return null;
            }

            const currentDeployment = await findCurrentDeployment();

            if (!currentDeployment) {
              core.warning(`No deployment found for environment ${environment} and SHA ${headSha}. Release notes will still be generated, but deployment status cannot be updated.`);
            }

            core.info(`Generating release notes for environment: ${environment}`);

            const jiraBase = process.env.JIRA_BASE_URL ? process.env.JIRA_BASE_URL.replace(/\/+$/, '') : '';
            const jiraEmail = process.env.JIRA_EMAIL;
            const jiraToken = process.env.JIRA_API_TOKEN;
            const hasJira = Boolean(jiraBase && jiraEmail && jiraToken);
            const basicAuth = hasJira
              ? Buffer.from(`${jiraEmail}:${jiraToken}`).toString('base64')
              : null;

            const keyRegex = /\b[A-Z][A-Z0-9]+-\d+\b/g;

            const fetchFn = typeof fetch === 'function'
              ? fetch
              : async function fetchPolyfill(urlString, options = {}) {
                  const { URL } = require('url');
                  const parsed = new URL(urlString);
                  const isHttps = parsed.protocol === 'https:';
                  const httpModule = require(isHttps ? 'https' : 'http');
                  const requestOptions = {
                    method: options.method || 'GET',
                    hostname: parsed.hostname,
                    port: parsed.port || (isHttps ? 443 : 80),
                    path: `${parsed.pathname}${parsed.search}`,
                    headers: options.headers || {},
                  };

                  const body = options.body;

                  return await new Promise((resolve, reject) => {
                    const req = httpModule.request(requestOptions, (res) => {
                      const chunks = [];
                      res.on('data', (chunk) => chunks.push(chunk));
                      res.on('end', () => {
                        const buffer = Buffer.concat(chunks);
                        const text = buffer.toString('utf-8');
                        resolve({
                          ok: res.statusCode >= 200 && res.statusCode < 300,
                          status: res.statusCode,
                          json: async () => (text ? JSON.parse(text) : {}),
                          text: async () => text,
                        });
                      });
                    });
                    req.on('error', reject);
                    if (body) {
                      req.write(typeof body === 'string' ? body : JSON.stringify(body));
                    }
                    req.end();
                  });
                };

            async function findPreviousSuccessfulDeployment() {
              try {
                const deployments = await github.paginate(github.rest.repos.listDeployments, {
                  owner,
                  repo,
                  environment,
                  per_page: 50,
                });

                for (const deployment of deployments) {
                  if (currentDeployment && deployment.id === currentDeployment.id) {
                    continue;
                  }
                  const statusesResponse = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 20,
                  });
                  const hasSuccess = statusesResponse.data.find((status) => status.state === 'success');
                  if (hasSuccess) {
                    return deployment;
                  }
                }
              } catch (error) {
                core.warning(`Unable to locate previous deployment for ${environment}: ${error.message}`);
              }

              return null;
            }

            const previousDeployment = await findPreviousSuccessfulDeployment();
            const baseSha = previousDeployment?.sha || null;

            let commits = [];

            const maxCommits = 50;

            if (baseSha) {
              const compareResponse = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${baseSha}...${headSha}`,
              });
              const compared = compareResponse.data.commits || [];
              commits = compared.slice(-maxCommits);
            } else {
              const commitsResponse = await github.paginate(github.rest.repos.listCommits, {
                owner,
                repo,
                sha: headSha,
                per_page: maxCommits,
              });
              commits = commitsResponse.slice(0, maxCommits).reverse();
            }

            if (!commits.length) {
              core.notice('No commits found between deployments.');
            }

            const jiraCache = new Map();

            async function fetchJiraIssue(key) {
              if (!hasJira) {
                return null;
              }
              if (jiraCache.has(key)) {
                return jiraCache.get(key);
              }
              try {
                const resp = await fetchFn(`${jiraBase}/rest/api/3/issue/${key}`, {
                  headers: {
                    Authorization: `Basic ${basicAuth}`,
                    Accept: 'application/json',
                  },
                });
                if (!resp.ok) {
                  core.warning(`Failed to fetch JIRA issue ${key}: ${resp.status}`);
                  jiraCache.set(key, null);
                  return null;
                }
                const data = await resp.json();
                const issue = {
                  key,
                  summary: data.fields?.summary || '',
                  status: data.fields?.status?.name || '',
                  url: `${jiraBase}/browse/${key}`,
                };
                jiraCache.set(key, issue);
                return issue;
              } catch (error) {
                core.warning(`Error fetching JIRA issue ${key}: ${error.message}`);
                jiraCache.set(key, null);
                return null;
              }
            }

            const issueMap = new Map();
            const unlinkedChanges = [];
            const issueHighlights = [];
            const miscHighlights = [];

            for (const commit of commits) {
              const sha = commit.sha;
              const shortSha = sha.substring(0, 7);
              const commitMessage = commit.commit?.message?.split('\n')[0] || '';
              const authorName = commit.commit?.author?.name || commit.author?.login || 'unknown';
              const commitUrl = commit.html_url || `https://github.com/${owner}/${repo}/commit/${sha}`;

              let prNumber = null;
              let prTitle = null;
              let prUrl = null;
              let headRef = '';

              try {
                const associatedPRs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: sha,
                });
                const pr = associatedPRs.data?.[0];
                if (pr) {
                  prNumber = pr.number;
                  prTitle = pr.title;
                  prUrl = pr.html_url;
                  headRef = pr.head?.ref || '';
                }
              } catch (error) {
                core.warning(`Unable to load PR for commit ${sha}: ${error.message}`);
              }

              const keySearchSpace = [commitMessage, prTitle, headRef].filter(Boolean).join(' ');
              const keys = new Set();
              let match;
              keyRegex.lastIndex = 0;
              while ((match = keyRegex.exec(keySearchSpace)) !== null) {
                keys.add(match[0]);
              }

              for (const key of keys) {
                if (!issueMap.has(key)) {
                  issueMap.set(key, { key, items: [] });
                }
                issueMap.get(key).items.push({
                  commitMessage,
                  prNumber,
                  prTitle,
                  prUrl,
                  authorName,
                  commitUrl,
                });
              }

              if (!keys.size) {
                const prFragment = prNumber ? `[#${prNumber}](${prUrl}) – ${prTitle}` : commitMessage;
                unlinkedChanges.push(`- ${prFragment} (${authorName}) ([${shortSha}](${commitUrl}))`);
                miscHighlights.push({
                  title: prNumber ? `#${prNumber} – ${prTitle || commitMessage}` : commitMessage,
                  url: prNumber ? prUrl : commitUrl,
                  author: authorName,
                });
              }
            }

            const jiraLines = [];
            for (const [key, info] of issueMap.entries()) {
              const issue = await fetchJiraIssue(key);
              const summary = issue?.summary?.trim() || 'Summary unavailable';
              const issueStatus = issue?.status ? ` _(Status: ${issue.status})_` : '';
              const fallbackUrl = jiraBase ? `${jiraBase}/browse/${key}` : '';
              const issueUrl = issue?.url || fallbackUrl;
              const issueLabel = issueUrl ? `[${key}](${issueUrl})` : key;
              jiraLines.push(`- ${issueLabel} – ${summary}${issueStatus}`);
              issueHighlights.push({
                key,
                summary,
                status: issue?.status || '',
                url: issueUrl || '',
                items: info.items.map((item) => ({
                  prNumber: item.prNumber,
                  prTitle: item.prTitle || item.commitMessage,
                  prUrl: item.prUrl || item.commitUrl,
                  author: item.authorName,
                  commitUrl: item.commitUrl,
                })),
              });
              for (const item of info.items) {
                const prFragment = item.prNumber ? `[#${item.prNumber}](${item.prUrl}) – ${item.prTitle}` : item.commitMessage;
                jiraLines.push(`  - ${prFragment} (${item.authorName})`);
              }
            }

            const lines = [];
            lines.push('');
            lines.push(`**Environment:** ${environment}`);
            lines.push(`**Deployed by:** ${deployer}`);
            lines.push(`**Workflow run:** [${runId}](${runUrl})`);
            lines.push(`**Head commit:** [${headSha.substring(0,7)}](https://github.com/${owner}/${repo}/commit/${headSha})`);
            if (baseSha) {
              lines.push(`**Previous deploy commit:** [${baseSha.substring(0,7)}](https://github.com/${owner}/${repo}/commit/${baseSha})`);
            } else {
              lines.push(`**Previous deploy commit:** _None found (initial deployment)_`);
            }
            if (image) {
              lines.push(`**Image:** \`${image}\``);
            }
            lines.push('');

            if (jiraLines.length || unlinkedChanges.length) {
              lines.push(`## Changes`);
              if (jiraLines.length) {
                lines.push(...jiraLines);
              }
              if (unlinkedChanges.length) {
                lines.push(`- Changes not linked to JIRA issues`);
                for (const entry of unlinkedChanges) {
                  lines.push(`  ${entry}`);
                }
              }
              lines.push('');
            } else {
              lines.push(`No code changes detected between deployments.`);
              lines.push('');
            }

            const markdownToPlain = (text) => (text || '')
              .replace(/\!\[[^\]]*\]\([^)]+\)/g, '')
              .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
              .replace(/[*_`]/g, '')
              .trim();

            const summaryCandidates = [
              jiraLines.find((line) => line.trim().startsWith('- ')),
              unlinkedChanges[0],
              `Deployment to ${environment} completed`,
            ].filter(Boolean);

            const statusSummary = markdownToPlain(
              summaryCandidates[0]?.replace(/^[-*]\s*/, '') || 'Deployment completed successfully.'
            );

            const noteBody = lines.join('\n');

            core.setOutput('base_sha', baseSha || '');
            core.setOutput('head_sha', headSha);
            core.setOutput('environment', environment);
            core.setOutput('deployment_id', currentDeployment?.id ? String(currentDeployment.id) : '');
            core.setOutput('run_url', runUrl);
            core.setOutput('status_summary', statusSummary);
            core.setOutput('deployed_by', deployer);

            const fs = require('fs');
            fs.writeFileSync('release_notes.md', noteBody, { encoding: 'utf8' });
            fs.writeFileSync(
              'highlights.json',
              JSON.stringify(
                {
                  issues: issueHighlights,
                  misc: miscHighlights,
                },
                null,
                2
              ),
              { encoding: 'utf8' }
            );

            if (noteBody) {
              core.summary.addHeading('Deployment Notes');
              core.summary.addRaw(noteBody);
              await core.summary.write();
            }
      - name: Upload release notes artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-notes-${{ github.run_id }}
          path: |
            release_notes.md
            highlights.json
          retention-days: 14

  update-deployment-status:
    needs: build-release-notes
    if: ${{ needs.build-release-notes.outputs.deployment_id != '' && needs.build-release-notes.outputs.environment != '' }}
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    env:
      DEPLOYMENT_ID: ${{ needs.build-release-notes.outputs.deployment_id }}
      RUN_URL: ${{ needs.build-release-notes.outputs.run_url }}
      ENVIRONMENT_NAME: ${{ needs.build-release-notes.outputs.environment }}
      STATUS_SUMMARY: ${{ needs.build-release-notes.outputs.status_summary }}
      APP_URL: ${{ vars.APP_URL }}
      NOTIFY_WEBHOOK: ${{ vars.NOTIFY_WEBHOOK }}
    steps:
      - name: Download release notes artifacts
        id: download_notes
        uses: actions/download-artifact@v4
        with:
          name: deployment-notes-${{ github.run_id }}
          path: deployment-notes

      - name: Prepare notification context
        shell: bash
        run: |
          set -euo pipefail
          env_url="${APP_URL:-}"

          notify_combined="${NOTIFY_WEBHOOK:-}"

          echo "ENVIRONMENT_URL=$env_url" >> "$GITHUB_ENV"
          echo "NOTIFY_WEBHOOKS=$notify_combined" >> "$GITHUB_ENV"

      - name: Update deployment status with release notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID);
            const runUrl = process.env.RUN_URL || '';
            const environmentUrl = process.env.ENVIRONMENT_URL || '';
            const summary = process.env.STATUS_SUMMARY || 'Deployment completed successfully.';

            const description = summary.length > 140 ? `${summary.slice(0, 137)}...` : summary;

            if (!deploymentId) {
              core.notice('Skipping deployment status update because deployment ID is missing.');
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              description,
              log_url: runUrl || undefined,
              environment_url: environmentUrl || undefined,
              auto_inactive: true,
            });

      - name: Notify Google Chat
        if: ${{ env.NOTIFY_WEBHOOKS != '' }}
        env:
          WEBHOOKS: ${{ env.NOTIFY_WEBHOOKS }}
          STATUS_SUMMARY: ${{ needs.build-release-notes.outputs.status_summary }}
          ENVIRONMENT_NAME: ${{ needs.build-release-notes.outputs.environment }}
          DEPLOYED_BY: ${{ needs.build-release-notes.outputs.deployed_by }}
          RUN_URL: ${{ needs.build-release-notes.outputs.run_url }}
          ENVIRONMENT_URL: ${{ env.ENVIRONMENT_URL }}
          ARTIFACT_DIR: ${{ steps.download_notes.outputs.download-path }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const https = require('https');
          const { URL } = require('url');
          const fs = require('fs');
          const path = require('path');

          const splitWebhooks = (value = '') =>
            value
              .split(/(\|\||\n|,)/)
              .map((part) => part.trim())
              .filter((part) => part && part !== '||' && part !== ',');

          const webhooks = splitWebhooks(process.env.WEBHOOKS || '');
          if (!webhooks.length) {
            console.log('No Google Chat webhooks configured; skipping notification.');
            process.exit(0);
          }

          const environment = process.env.ENVIRONMENT_NAME || 'Unknown';
          const deployedBy = process.env.DEPLOYED_BY || 'unknown';
          const summary = process.env.STATUS_SUMMARY || 'Deployment completed successfully.';
          const runUrl = process.env.RUN_URL || '';
          const environmentUrl = process.env.ENVIRONMENT_URL || '';
          const artifactDir = process.env.ARTIFACT_DIR || '.';
          const highlightsPath = path.join(artifactDir, 'highlights.json');
          let highlightsData = {};
          try {
            const fileData = fs.readFileSync(highlightsPath, { encoding: 'utf8' });
            const parsed = JSON.parse(fileData);
            if (parsed && typeof parsed === 'object') {
              highlightsData = parsed;
            }
          } catch (error) {
            console.warn(`Failed to read highlights data: ${error.message}`);
          }

          const issueHighlights = Array.isArray(highlightsData.issues) ? highlightsData.issues : [];
          const miscHighlights = Array.isArray(highlightsData.misc) ? highlightsData.misc : [];

          const widgets = [];

          widgets.push({
            decoratedText: {
              topLabel: 'Environment',
              text: environment,
            },
          });

          widgets.push({
            decoratedText: {
              topLabel: 'Summary',
              text: summary,
              wrapText: true,
            },
          });

          widgets.push({
            decoratedText: {
              topLabel: 'Deployed by',
              text: deployedBy,
            },
          });

          if (environmentUrl) {
            widgets.push({
              decoratedText: {
                topLabel: 'Environment URL',
                text: environmentUrl,
                wrapText: true,
                onClick: { openLink: { url: environmentUrl } },
              },
            });
          }

          if (runUrl) {
            widgets.push({
              decoratedText: {
                topLabel: 'Workflow Run',
                text: runUrl,
                wrapText: true,
                onClick: { openLink: { url: runUrl } },
              },
            });
          }

          const sections = [{ widgets }];

          if (issueHighlights.length) {
            const issueText = issueHighlights
              .map((issue) => {
                const issueLink = issue.url ? `<a href="${issue.url}">${issue.key}</a>` : issue.key;
                const statusSuffix = issue.status ? ` (Status: ${issue.status})` : '';
                const header = `<b>${issueLink}</b> – ${issue.summary || 'No summary'}${statusSuffix}`;
                const items = Array.isArray(issue.items)
                  ? issue.items
                      .map((item) => {
                        const linkTarget = item.prUrl || item.commitUrl || '';
                        const linkText = item.prNumber
                          ? `#${item.prNumber} – ${item.prTitle || 'Details'}`
                          : item.prTitle || linkTarget || 'Details';
                        const link = linkTarget ? `<a href="${linkTarget}">${linkText}</a>` : linkText;
                        const authorPart = item.author ? ` (${item.author})` : '';
                        return `• ${link}${authorPart}`;
                      })
                      .join('<br>')
                  : '';
                return items ? `${header}<br>${items}` : header;
              })
              .join('<br><br>');

            sections.push({
              header: 'JIRA Issues',
              widgets: [
                {
                  textParagraph: {
                    text: issueText,
                  },
                },
              ],
            });
          }

          if (miscHighlights.length) {
            const miscText = miscHighlights
              .map((item) => {
                const link = item.url ? `<a href="${item.url}">${item.title}</a>` : item.title;
                const authorPart = item.author ? ` (${item.author})` : '';
                return `• ${link}${authorPart}`;
              })
              .join('<br>');
            sections.push({
              header: 'Changes without JIRA',
              widgets: [
                {
                  textParagraph: {
                    text: miscText,
                  },
                },
              ],
            });
          }

          const buttons = [];
          if (environmentUrl) {
            buttons.push({
              text: 'View Environment',
              onClick: { openLink: { url: environmentUrl } },
            });
          }
          if (runUrl) {
            buttons.push({
              text: 'Workflow Run',
              onClick: { openLink: { url: runUrl } },
            });
          }

          if (buttons.length) {
            sections.push({
              widgets: [
                {
                  buttonList: {
                    buttons,
                  },
                },
              ],
            });
          }

          const payload = {
            cardsV2: [
              {
                cardId: 'deployment-notes',
                card: {
                  header: {
                    title: `Deployment to ${environment} succeeded`
                  },
                  sections,
                },
              },
            ],
          };

          const payloadData = JSON.stringify(payload);

          const send = (webhook) =>
            new Promise((resolve, reject) => {
              try {
                const url = new URL(webhook);
                const options = {
                  method: 'POST',
                  hostname: url.hostname,
                  path: url.pathname + url.search,
                  headers: {
                    'Content-Type': 'application/json; charset=UTF-8',
                    'Content-Length': Buffer.byteLength(payloadData),
                  },
                };

                const req = https.request(options, (res) => {
                  const chunks = [];
                  res.on('data', (chunk) => chunks.push(chunk));
                  res.on('end', () => {
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      console.log(`Sent notification to ${webhook.substring(0, 60)}…`);
                      resolve();
                    } else {
                      const body = Buffer.concat(chunks).toString();
                      reject(new Error(`Webhook ${webhook} returned HTTP ${res.statusCode}: ${body}`));
                    }
                  });
                });
                req.on('error', reject);
                req.write(payloadData);
                req.end();
              } catch (error) {
                reject(error);
              }
            });

          Promise.allSettled(webhooks.map(send))
            .then((results) => {
              const failures = results.filter((result) => result.status === 'rejected');
              if (failures.length) {
                failures.forEach((failure) => console.error(failure.reason));
                console.warn(`One or more webhook notifications failed (${failures.length}/${webhooks.length}).`);
                process.exit(0);
              } else {
