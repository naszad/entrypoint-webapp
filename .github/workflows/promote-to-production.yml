name: Promote image to Production

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full Docker image reference to deploy (e.g., us-central1-docker.pkg.dev/project/repo/image@sha256:...)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy selected image
    permissions:
      contents: read
      id-token: write
      deployments: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/deploy-to-cloud-run.yml
    with:
      image: ${{ inputs.image }}
      environment: Production
    secrets: inherit
