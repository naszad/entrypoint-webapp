name: Release to Production

on:
  release:
    types: [published]

env:
  IMAGE_NAME: "entrypoint-webapp"
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_HOSTNAME: ${{ vars.GAR_HOSTNAME }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}

jobs:
  deploy-preview:
    name: Deploy tagged release (no traffic)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
      REVISION_TAG: preview-${{ github.run_id }}

    outputs:
      preview_url: ${{ steps.tag_info.outputs.url }}
      revision: ${{ steps.tag_info.outputs.revision }}
      revision_tag: ${{ env.REVISION_TAG }}

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Deploy release image without traffic
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.GAR_LOCATION }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          tag: ${{ env.REVISION_TAG }}
          no_traffic: true

      - name: Capture tagged URL and revision
        id: tag_info
        env:
          TAG: ${{ env.REVISION_TAG }}
        run: |
          INFO=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --region "${CLOUD_RUN_REGION}" --format json)
          URL=$(echo "$INFO" | jq -r --arg TAG "$TAG" '.status.traffic[] | select(.tag==$TAG) | .url' | head -n 1)
          REVISION=$(echo "$INFO" | jq -r --arg TAG "$TAG" '.status.traffic[] | select(.tag==$TAG) | .revisionName' | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Tagged URL not found" >&2
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Preview URL
        env:
          PREVIEW_URL: ${{ steps.tag_info.outputs.url }}
        run: |
          cat <<SUMMARY >> "$GITHUB_STEP_SUMMARY"
          ## Preview ready
          - Version: ${RELEASE_VERSION}
          - Image: ${GAR_LOCATION}/${IMAGE_NAME}:${RELEASE_VERSION}
          - Tagged URL: ${PREVIEW_URL}
          - Traffic: 0% (manual promotion required)
          SUMMARY

  promote-to-production:
    name: Promote tagged release to 100%
    needs: deploy-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: Production
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
      REVISION: ${{ needs.deploy-preview.outputs.revision }}

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Shift traffic to approved revision
        run: |
          if [ -z "${REVISION}" ] || [ "${REVISION}" = "null" ]; then
            echo "Missing revision from preview deployment" >&2
            exit 1
          fi
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --region "${CLOUD_RUN_REGION}" \
            --to-revisions "${REVISION}=100"

      - name: Update GitHub release state
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = context.payload.release.id;
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease: false,
            });

      - name: Promotion summary
        run: |
          cat <<SUMMARY >> "$GITHUB_STEP_SUMMARY"
          ## Production traffic switched
          - Version: ${RELEASE_VERSION}
          - Revision: ${REVISION}
          - Default traffic: 100%
          SUMMARY
