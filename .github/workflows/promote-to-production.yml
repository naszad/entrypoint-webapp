name: Release to Production

on:
  release:
    types: [published]

env:
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  resolve-image:
    name: Resolve release image in Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve image by tag
        id: resolve
        run: |
          TAG="${RELEASE_TAG}"

          # Find image package in GAR by tag
          IMAGE=$(gcloud artifacts docker images list "${GAR_LOCATION}" \
            --filter="tags:${TAG}" \
            --format="value(package)" | head -n 1)

          # Fallback: try without leading 'v'
          if [ -z "$IMAGE" ] && [ "${TAG:0:1}" = "v" ]; then
            ALT_TAG=${TAG#v}
            IMAGE=$(gcloud artifacts docker images list "${GAR_LOCATION}" \
              --filter="tags:${ALT_TAG}" \
              --format="value(package)" | head -n 1)
            if [ -n "$IMAGE" ]; then
              TAG=$ALT_TAG
            fi
          fi

          if [ -z "$IMAGE" ]; then
            echo "No image found in ${GAR_LOCATION} with tag ${RELEASE_TAG}" >&2
            exit 1
          fi

          IMAGE_REF="${IMAGE}:${TAG}"
          echo "Resolved image: ${IMAGE_REF}"
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy release image to Cloud Run (with optional approval)
    needs: resolve-image
    uses: ./.github/workflows/deploy-to-cloud-run.yml
    permissions:
      contents: write
      id-token: write
      deployments: write
      pull-requests: write
      actions: write
    with:
      image: ${{ needs.resolve-image.outputs.image }}
      environment: Production
      no_traffic: true
      approvers: ${{ vars.APPROVERS }}
      revision_tag: prod-${{ github.run_id }}
    secrets: inherit
