# .github/workflows/migrate-after-vercel.yml
name: Wait for Vercel Deploy + Run Migrations

on:
  push:
    branches:
      - main

jobs:
  migrate-after-vercel:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Wait for Vercel production deploy to succeed
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}  # lowercase and matches Vercel dashboard slug
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for Vercel to deploy commit $GITHUB_SHA..."

          for i in {1..30}; do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?teamId=${VERCEL_TEAM_ID}&projectId=${VERCEL_PROJECT_ID}&limit=5")

            MATCHING=$(echo "$RESPONSE" | jq -r \
              '.deployments[] | select(.meta.githubCommitSha == "'"$GITHUB_SHA"'") | select(.target == "production") | select(.readyState == "READY") | .url')

            if [[ ! -z "$MATCHING" ]]; then
              echo "✅ Deployment ready at: https://$MATCHING"
              break
            fi

            echo "⏳ Not ready yet. Retrying in 10s ($i/30)..."
            sleep 10
          done

          if [[ -z "$MATCHING" ]]; then
            echo "❌ Timed out waiting for production deploy."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Drizzle Migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx drizzle-kit migrate --log