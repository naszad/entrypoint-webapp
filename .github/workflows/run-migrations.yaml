name: Wait for Vercel Deploy + Run Drizzle Migrations

on:
  push:
    branches: [main]

jobs:
  migrate-dev:
    name: Wait and Migrate (Dev)
    runs-on: ubuntu-latest
    environment: Dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Wait for Vercel Dev Deployment
        id: wait_for_deploy
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          max_timeout: 300 # seconds
          check_interval: 10 # polling interval
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Check for Uncommitted Schema Changes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Validating schema against database..."
          npx drizzle-kit studio --check
        continue-on-error: false  # Fail the build if schema and DB are out of sync

      - name: Run Drizzle Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Applying migrations to dev database..."
          npx drizzle-kit migrate --log